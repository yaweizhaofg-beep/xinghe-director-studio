<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 导演台 · 星核耀火</title><link rel="stylesheet" href="./ui/studio.css"><link rel="stylesheet" href="./ui/brand.css"></head><body>
<header><span>星核耀火 <span style="color:#7f8293;font-weight:400">/ 3D 导演台</span></span><span class="project-title">本地项目 · 自动保存</span><div class="actions"><button id="undo" title="撤销 ⌘Z">↶</button><button id="redo" title="重做 ⇧⌘Z">↷</button><button id="export-project">保存工程</button><button id="import-project">打开工程</button><input id="project-file" type="file" accept=".json" hidden></div></header>
<main><nav class="rail"><button data-panel="scene" title="场景" aria-label="场景">▱</button><button data-panel="actors" title="添加角色" aria-label="添加角色">♙</button><button data-panel="cameras" title="添加机位" aria-label="添加机位">▣</button><button data-panel="props" title="道具" aria-label="道具">▧</button><button data-panel="media" title="参考素材" aria-label="参考素材">▨</button><button id="help" title="使用帮助">?</button></nav>
<aside class="objects"><h2 id="library-title">场景</h2><div id="scene-panel"><input id="search" placeholder="搜索场景对象" aria-label="搜索场景对象"><div id="objects"></div></div><div id="asset-panel" hidden><div id="asset-grid"></div></div><div id="camera-panel" hidden><p>调整导演视角后，点击下方创建机位。</p><button id="add-camera">＋ 取当前视角</button><select id="camera-list" aria-label="选择机位"></select></div><div id="media-panel" hidden><div id="media"></div></div><div hidden><select id="asset"><option value="adult">成人</option></select><button id="add">添加</button></div></aside>
<section class="workspace"><div id="stage"><div id="collision-state">碰撞检查准备中…</div><div id="model-state" role="status">正在加载真实人物…</div><div id="labels"></div><div class="view-switch segments"><button id="director" aria-pressed="true">导演视角</button><button id="view-camera" aria-pressed="false">机位视角</button></div><div class="view-tools"><button id="top-view">顶视图</button><button id="focus">聚焦</button><button id="reset-view">重置视角</button></div><div id="route-tools" hidden><span id="route-hint"></span><button id="undo-point">撤回一笔</button><button id="finish-route">完成</button><button id="cancel-route">取消</button></div><span id="stage-tip">点击选中 · 拖空白旋转 · 右键平移 · 滚轮缩放</span><div class="floating-tools"><div class="tool-group"><button data-mode="translate" aria-pressed="true" title="移动 W">↖<small>移动</small></button><button data-mode="rotate" title="旋转 E">⟳<small>旋转</small></button><button data-mode="scale" title="缩放 R">⤢<small>缩放</small></button><button id="edit-joints" title="调整人物关节">♙<small>关节</small></button><button id="capture" title="截图">▣<small>截图</small></button><button id="timeline-toggle" title="动画时间轴">◴<small>动画</small></button></div><button id="record" class="record">录制参考视频</button></div><div id="context-menu" hidden></div><div id="joint-handles"></div></div>
<section id="timeline" hidden><div class="transport"><button id="play">▶ 播放</button><button id="rewind">↺</button><input id="seek" type="range" min="0" max="6" step=".01" value="0" aria-label="播放进度"><output id="clock">0.0 / 6.0 秒</output><button id="timeline-close">收起</button></div><div class="clip-tools"><label>总时长（秒）<input id="total-sec" type="number" min=".2" step=".1"></label><label>片段时长（秒）<input id="clip-sec" type="number" min=".2" step=".1"></label><input id="clip-color" type="color" title="片段颜色" aria-label="片段颜色"><button id="split-clip">分割</button><button id="remove-clip">删除片段</button></div><div id="tracks" class="tracks"></div></section><div id="status" role="status">选中人物 → 姿势 → 拖动手脚控制点；右键可快速切换姿势。</div></section>
<aside class="inspector"><h2 id="selected-title">角色</h2><div class="inspector-tabs"><button data-tab="properties" aria-pressed="true">属性</button><button data-tab="pose">姿势</button><button data-tab="motion">运动轨迹</button></div><section id="properties-tab"><label>名称<input id="name" maxlength="24"></label><label>备注<input id="note" maxlength="48" placeholder="仅在导演视角显示"></label><label>位置</label><div class="coordinates"><label>X<input id="x" type="number" step=".1"></label><label>Y<input id="y" type="number" step=".1"></label><label>Z<input id="z" type="number" step=".1"></label></div><label>旋转</label><div class="coordinates"><label>X<input id="rx" type="number" step="5"></label><label>Y<input id="ry" type="number" step="5"></label><label>Z<input id="rz" type="number" step="5"></label></div><label>缩放</label><div class="coordinates"><label>X<input id="sx" type="number" step=".1" min=".1"></label><label>Y<input id="sy" type="number" step=".1" min=".1"></label><label>Z<input id="sz" type="number" step=".1" min=".1"></label></div><label>统一缩放<input id="uniform-scale" type="range" min=".2" max="3" step=".01" value="1"></label><label>颜色<input id="actor-color" type="color" value="#4f8ef7"></label><div class="row"><button id="duplicate">复制</button><button id="delete">删除</button></div><div id="actor-tools"><label>人物体型<select id="actor-age"></select></label></div><div id="camera-tools" hidden><label>焦距 <span id="focal-label"></span><input id="focal" type="range" min="16" max="90" value="35"></label><label>注视对象<select id="look-at"></select></label><div id="preview"></div><label>运镜<select id="cam-move"><option value="push">推近</option><option value="pull">拉远</option><option value="slide">横移</option><option value="orbit">环绕</option></select></label><button id="add-shot">添加运镜片段</button><button id="camera-key">记录当前机位到时间轴</button></div><div id="prop-tools" hidden><button id="use-prop" hidden></button><button id="door" hidden>打开车门</button></div><label>画幅<select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option></select></label></section>
<section id="pose-tab" hidden><button id="animate-pose">把当前姿势做成动作</button><label>姿势预设</label><div id="pose-grid"></div><div hidden><select id="pose"></select><select id="joint"></select><input id="joint-angle" type="range" min="-160" max="160"></div><div class="pose-help">拖动手、肘、膝、脚圆点调整姿势，拖头部圆点转头；下方滑块可精确微调。</div><button id="reset-pose">重置为站立</button><div id="joint-controls"></div></section>
<section id="motion-tab" hidden><div id="motion-tools"><button id="draw-route">铅笔画轨迹</button><p>按住地面画路线，松开可续画，点完成保存。</p><div class="coordinates two"><label>开始（秒）<input id="begin" type="number" min="0" step=".1"></label><label>用时（秒）<input id="seconds" type="number" min=".2" step=".1"></label></div><button id="clear-route">清除路线</button></div></section></aside></main><script type="module" src="./studio.js?v=layout2"></script></body></html>
